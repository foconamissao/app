<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — Missão PE</title><link rel="stylesheet" href="./css/variables.css"><link rel="stylesheet" href="./css/global.css"><link rel="stylesheet" href="./css/responsive.css"></head><body><div class="overlay"></div><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">PE</div><div><strong>FOCO NA MISSÃO</strong><small>MISSÃO PE</small></div></div><nav class="nav"><a href="./index.html">🏠 Início</a><a href="./missao.html">🎯 Minha Missão</a><a href="./cronograma.html">📅 Cronograma</a><a href="./questoes.html">📝 Questões</a><a href="./flashcards.html">🧠 Flashcards</a><a href="./erros.html">📕 Caderno de Erros</a><a href="./simulados.html">🏆 Simulados</a><a href="./desempenho.html">📊 Desempenho</a><a href="./ranking.html">👥 Ranking</a><div class="admin"><a data-nav="admin" href="./admin.html">⚙ Administração</a><a href="#" id="logout">🚪 Sair</a></div></nav></aside><main class="main"><header class="topbar"><div><button id="mobileMenu" class="btn secondary mobile-menu">☰</button><h1 id="pageTitle">Administração</h1></div><span id="userName" class="muted"></span></header><div id="adminArea"><section class="grid stats"><div class="card stat"><span>📅</span><b>Cronograma</b></div><div class="card stat"><span>🎯</span><b>Missões</b></div><div class="card stat"><span>🧠</span><b>Flashcards</b></div><div class="card stat"><span>🏆</span><b>Simulados oficiais</b></div></section><div class="section-title"><h2>Cadastrar questão</h2></div><form id="questionForm" class="card"><div class="form-grid"><div class="field"><label>ID da disciplina</label><input name="disciplina_id" type="number" required></div><div class="field"><label>ID do assunto</label><input name="assunto_id" type="number"></div><div class="field"><label>Banca</label><input name="banca"></div><div class="field"><label>Ano</label><input name="ano" type="nu
