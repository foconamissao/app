<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="login-logo"><img src="./assets/logo-foco-na-missao.png" alt="Foco na Missão — Concurseiros na Missão"></div>
      <h1>Acesso à plataforma</h1>
      <p>Entre para continuar a missão.</p>

      <form id="loginForm">
        <div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="loginPassword">Senha</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn" type="submit">ENTRAR</button>
      </form>

      <div class="signup-cta">
        <div class="signup-divider"><span>ou</span></div>
        <p class="signup-question">Ainda não faz parte da missão?</p>
        <a class="signup-button" id="createAccountLink" href="./cadastro.html">CRIAR MINHA CONTA</a>
      </div>
      <div id="msg" class="notice muted"></div>
    </section>
  </main>
  <script src="./js/supabase-loader.js?v=4.3.2"></script>
