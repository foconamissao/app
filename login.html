<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Missão PE</title><link rel="stylesheet" href="./css/variables.css"><link rel="stylesheet" href="./css/global.css"></head><body><main class="login-shell"><section class="login-card"><div class="login-logo"><img src="./assets/logo-missao-pe.png" alt="Foco na Missão — Missão Pernambuco"></div><h1>Acesso à plataforma</h1><p>Entre ou faça seu cadastro para continuar a missão.</p><div class="login-tabs"><button id="loginTab" class="tab active" type="button">ENTRAR</button><button id="registerTab" class="tab" type="button">CRIAR CONTA</button></div><form id="loginForm"><div class="field"><label>E-mail</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>Senha</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">ENTRAR</button></form><form id="registerForm" class="hidden"><div class="field"><label>Nome</label><input name="nome" autocomplete="name" required maxlength="120"></div><div class="field"><label>E-mail</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>Senha</label><input name="password" type="password" autocomplete="new-password" minlength="6" required></div><div class="field"><label>Confirmar senha</label><input name="confirm" type="password" autocomplete="new-password" minlength="6" required></div><button class="btn" type="submit">CRIAR MINHA CONTA</button></form><div id="msg" class="notice muted"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="./js/login.js"></script></body></html>
