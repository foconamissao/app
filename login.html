<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Missão PE</title>
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/global.css?v=1.2.3">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="login-logo"><img src="./assets/logo-missao-pe.png" alt="Foco na Missão — Missão Pernambuco"></div>
      <h1>Acesso à plataforma</h1>
      <p>Entre para continuar a missão.</p>

      <form id="loginForm">
        <div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="loginPassword">Senha</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn" type="submit">ENTRAR</button>
      </form>

      <div class="signup-cta">
        <div class="signup-divider"><span>ou</span></div>
        <p class="signup-question">Ainda não faz parte da missão?</p>
        <a class="signup-button" id="createAccountLink" href="./cadastro.html">CRIAR MINHA CONTA</a>
      </div>
      <div id="msg" class="notice muted"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/login.js"></script>
</body>
</html>
